<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weather Dashboard - Agent Bricks + Weather MCP</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 32px; }
    .lookup { display: flex; gap: 8px; margin-bottom: 24px; }
    .lookup input { flex: 1; padding: 8px; }
    .lookup button, #refresh { padding: 8px 14px; cursor: pointer; }
    .cards { display: flex; gap: 16px; margin-bottom: 24px; }
    .card { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    .card .label { color: #666; font-size: 0.85rem; }
    .card .value { font-size: 1.4rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 32px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .error { color: #b3261e; }
    .tool { font-family: monospace; font-size: 0.85rem; color: #555; }
  </style>
</head>
<body>
  <h1>&#127783;&#65039; Weather Dashboard</h1>
  <p>Watching questions the Agent Bricks agent has asked through the weather MCP server.</p>

  <div class="lookup">
    <input id="location-input" type="text" placeholder="e.g. Austin, TX" />
    <button id="lookup-btn">Look up current weather</button>
  </div>
  <div id="lookup-result"></div>

  <h2>Recent Agent Queries / Predictions <button id="refresh">Refresh</button></h2>
  <table>
    <thead><tr><th>Time</th><th>User</th><th>Tool</th><th>Location</th><th>Result</th></tr></thead>
    <tbody id="recent-body"></tbody>
  </table>

  <script>
    async function lookup() {
      const location = document.getElementById('location-input').value.trim();
      const resultEl = document.getElementById('lookup-result');
      if (!location) return;
      resultEl.textContent = 'Looking up...';
      const res = await fetch(`/api/weather?location=${encodeURIComponent(location)}`);
      const data = await res.json();
      if (!res.ok) {
        resultEl.innerHTML = `<p class="error">${data.error}</p>`;
        return;
      }
      resultEl.innerHTML = `
        <div class="cards">
          <div class="card"><div class="label">${data.location}</div><div class="value">${data.temperature_f}&deg;F</div></div>
          <div class="card"><div class="label">Conditions</div><div class="value">${data.conditions}</div></div>
          <div class="card"><div class="label">Feels like</div><div class="value">${data.feels_like_f}&deg;F</div></div>
        </div>`;
    }

    async function refresh() {
      const res = await fetch('/api/recent');
      const rows = await res.json();
      const body = document.getElementById('recent-body');
      body.innerHTML = '';
      for (const r of rows) {
        body.innerHTML += `<tr>
          <td>${new Date(r.created_at).toLocaleString()}</td>
          <td>${r.email}</td>
          <td class="tool">${r.tool_name}</td>
          <td>${r.location}</td>
          <td>${r.result_summary || ''}</td>
        </tr>`;
      }
    }

    document.getElementById('lookup-btn').addEventListener('click', lookup);
    document.getElementById('refresh').addEventListener('click', refresh);
    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
